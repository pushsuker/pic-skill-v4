# รันทั้งระบบด้วยคำสั่งเดียว: docker compose up
# รุ่นออฟไลน์: node_modules เก็บใน named volume (ไม่หายเมื่อ down) และ npm install ใช้ของที่มีอยู่ก่อน
# db = MySQL, phpmyadmin = ดูตาราง, backend = Express API, frontend = Vue
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: evaluation
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot1234"]
      interval: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root1234
    ports:
      - "8080:80"
    depends_on:
      - db

  backend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install --prefer-offline --no-audit --no-fund && npm run seed && npm run dev"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root1234
      DB_NAME: evaluation
      PORT: 3000
      JWT_SECRET: evaluation-2569-secret-key-change-me
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install --prefer-offline --no-audit --no-fund && npm run dev"
    environment:
      API_URL: http://backend:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
  backend_modules:
  frontend_modules:
